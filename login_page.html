<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Hệ thống Quản lý Đề tài Khoa CNTT</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at 10% 20%, rgba(37, 99, 235, 0.15) 0%, rgba(15, 23, 42, 1) 90%), linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #1e3a8a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1e293b;
        }
        .login-card {
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 1.5rem;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(20px);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.4), 0 18px 36px -18px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        .login-header {
            background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
            color: #ffffff;
            padding: 3rem 2rem 2.5rem;
            text-align: center;
            position: relative;
        }
        .login-header i.brand-icon {
            font-size: 3.5rem;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.2));
        }
        .form-control:focus {
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
            border-color: #2563eb;
        }
        .btn-login {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            border: none;
            font-weight: 700;
            padding: 0.85rem;
            border-radius: 0.75rem;
            letter-spacing: 0.03em;
            transition: all 0.25s ease;
            box-shadow: 0 8px 20px -4px rgba(37, 99, 235, 0.4);
        }
        .btn-login:hover {
            background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
            transform: translateY(-2px);
            box-shadow: 0 12px 25px -4px rgba(37, 99, 235, 0.5);
        }
        .credential-box {
            background-color: #f8fafc;
            border: 1px dashed #cbd5e1;
            border-radius: 1rem;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card login-card">
                <div class="login-header">
                    <i class="bi bi-mortarboard-fill brand-icon mb-2 d-inline-block"></i>
                    <h4 class="fw-extrabold mb-1 tracking-tight">KHOA CÔNG NGHỆ THÔNG TIN</h4>
                    <p class="mb-0 text-white-50 fs-6">Hệ thống Quản lý Đề tài (Môn học / NCKH / KLTN)</p>
                </div>
                <div class="card-body p-3 p-md-5">
                    <!-- Error or Logout alert -->
                    
                    

                    <form action="/login" method="post"><input type="hidden" name="_csrf" value="Y3LAO--C7OBOJCXK5LV0Xn9RkjH2WKrIMWl-fSNEMDMJsJe_WxOiCdrk2oNjQUap05hAZxxhv1OVYZrlBQ9JTxF8BAo7gKKM"/>
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold text-secondary small">TÊN ĐĂNG NHẬP</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted px-3"><i class="bi bi-person fs-5"></i></span>
                                <input type="text" class="form-control bg-light border-start-0 py-2 fs-6" id="username" name="username" placeholder="Nhập tên đăng nhập" required autofocus>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold text-secondary small">MẬT KHẨU</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted px-3"><i class="bi bi-lock fs-5"></i></span>
                                <input type="password" class="form-control bg-light border-start-0 py-2 fs-6" id="password" name="password" placeholder="Nhập mật khẩu" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-login w-100 mb-4">
                            <i class="bi bi-box-arrow-in-right me-2"></i> ĐĂNG NHẬP HỆ THỐNG
                        </button>
                    </form>

                    <!-- Quick Credentials for Testing -->
                    <div class="p-3 credential-box">
                        <h6 class="fw-bold mb-2 text-primary d-flex align-items-center" style="font-size: 0.85rem;">
                            <i class="bi bi-key-fill me-2 fs-6"></i> TÀI KHOẢN THỬ NGHIỆM MẪU:
                        </h6>
                        <ul class="list-unstyled mb-0" style="font-size: 0.8rem; line-height: 1.6;">
                            <li><i class="bi bi-shield-check me-1 text-purple"></i> <strong>Trưởng Khoa (Admin):</strong> <code class="bg-white px-2 py-0.5 rounded border text-primary">admin</code> / <code class="bg-white px-2 py-0.5 rounded border text-muted">admin123</code></li>
                            <li><i class="bi bi-person-badge me-1 text-success"></i> <strong>Giảng viên:</strong> <code class="bg-white px-2 py-0.5 rounded border text-primary">gv_nguyenvana</code> / <code class="bg-white px-2 py-0.5 rounded border text-muted">123456</code></li>
                            <li><i class="bi bi-mortarboard me-1 text-info"></i> <strong>Sinh viên:</strong> <code class="bg-white px-2 py-0.5 rounded border text-primary">sv_nguyenvanf</code> / <code class="bg-white px-2 py-0.5 rounded border text-muted">123456</code></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
