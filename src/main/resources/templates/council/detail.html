<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Chi tiết Hội đồng Phản biện</title>
</head>
<body>
<div layout:fragment="content">
    <div class="mb-4">
        <a href="/admin/councils" class="btn btn-sm btn-outline-secondary mb-2"><i class="bi bi-arrow-left"></i> Quay lại Danh sách</a>
        <h3 class="fw-bold mb-1" th:text="${council.name}">Tên Hội đồng</h3>
        <p class="text-muted mb-0">Mã Hội đồng: <strong th:text="${council.councilCode}">HD01</strong> | Thuộc đợt: <span th:text="${council.periodName}">Đợt 1</span></p>
    </div>

    <div class="row g-4">
        <div class="col-md-5">
            <div class="card card-custom p-4">
                <h5 class="fw-bold mb-3"><i class="bi bi-people-fill text-primary me-2"></i>Thành viên Hội đồng</h5>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item d-flex justify-content-between align-items-center py-3" th:each="m : ${council.members}">
                        <div>
                            <strong th:text="${m.fullName}">Họ tên</strong>
                            <small class="text-muted d-block" th:text="${m.teacherCode}">GV001</small>
                        </div>
                        <span class="badge" th:classappend="${m.role == 'CHAIRMAN' ? 'bg-warning text-dark' : (m.role == 'SECRETARY' ? 'bg-info text-dark' : 'bg-secondary')}" th:text="${m.role}">MEMBER</span>
                    </li>
                </ul>
            </div>
        </div>

        <div class="col-md-7">
            <div class="card card-custom p-4">
                <h5 class="fw-bold mb-3"><i class="bi bi-journal-bookmark text-primary me-2"></i>Danh sách Đề tài được Gán</h5>
                <div th:if="${council.assignedTopics.empty}" class="text-muted py-3">Chưa có đề tài nào được gán cho Hội đồng này.</div>
                <div class="list-group list-group-flush" th:unless="${council.assignedTopics.empty}">
                    <div class="list-group-item py-3 px-0 border-bottom" th:each="top : ${council.assignedTopics}">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <strong class="text-dark" th:text="${top.title}">Tên đề tài</strong>
                            <a th:href="@{/scoring/topic/{id}(id=${top.id})}" class="btn btn-sm btn-outline-primary">Xem Điểm / Chấm</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
