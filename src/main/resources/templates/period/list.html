<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Quản lý Đợt đăng ký - Admin</title>
    <style>
        .table-responsive {
            min-height: 250px;
        }
        #periodKanban {
            overflow-x: auto;
        }
        .period-kanban-board {
            display: grid;
            grid-auto-columns: minmax(190px, 1fr);
            grid-auto-flow: column;
            gap: .75rem;
            padding-bottom: .5rem;
        }
        .period-kanban-column {
            --period-column-color: var(--bs-primary);
            min-height: 150px;
            padding: .75rem;
            border: 1px solid color-mix(in srgb, var(--period-column-color) 38%, var(--bs-border-color));
            border-top: 4px solid var(--period-column-color);
            border-radius: .5rem;
            background: color-mix(in srgb, var(--period-column-color) 9%, var(--bs-body-bg));
        }
        .period-kanban-heading {
            min-height: 2.5rem;
            font-size: .85rem;
            font-weight: 700;
            color: var(--period-column-color);
        }
        .period-kanban-card {
            margin-top: .6rem;
            padding: .65rem;
            border: 1px solid color-mix(in srgb, var(--period-column-color) 30%, var(--bs-border-color));
            border-left: 3px solid var(--period-column-color);
            border-radius: .35rem;
            background: var(--bs-body-bg);
            overflow-wrap: anywhere;
            cursor: grab;
            user-select: none;
        }
        .period-kanban-card:active {
            cursor: grabbing;
        }
        .period-kanban-card--ghost {
            opacity: .35;
        }
        .period-kanban-items {
            min-height: 100px;
        }
        .period-kanban-empty {
            color: var(--bs-secondary-color);
            font-size: .8rem;
        }
    </style>
    <link rel="stylesheet" th:href="@{/vendor/fullcalendar/skeleton.css}">
    <link rel="stylesheet" th:href="@{/vendor/fullcalendar/themes/classic/theme.css}">
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <div th:replace="~{fragments/components :: pageHeading('QUẢN LÝ ĐỢT ĐĂNG KÝ', 'Danh sách tất cả các đợt đăng ký môn học/NCKH/TLCN/KLTN trong Khoa', 'bi-calendar3')}"></div>
        </div>
        <a href="/admin/periods/create" class="btn btn-primary shadow-sm rounded-pill px-3">
            <i class="bi bi-plus-circle me-1"></i> Tạo Đợt đăng ký mới
        </a>
    </div>

    <div class="card card-custom p-4">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>#</th>
                        <th>Tên Đợt</th>
                        <th>Loại Hình</th>
                        <th>Toàn đợt</th>
                        <th>Thời gian GV Đăng ký</th>
                        <th>Thời gian Khoa Duyệt</th>
                        <th>Thời gian SV Đăng ký</th>
                        <th>Trạng thái</th>
                        <th class="text-end">Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${periods.empty}">
                        <td colspan="9" class="text-center py-4 text-muted">Chưa có đợt đăng ký nào được tạo.</td>
                    </tr>
                    <tr th:each="p, stat : ${periods}">
                        <td th:text="${stat.count}">1</td>
                        <td>
                            <strong th:text="${p.name}">Đợt 1</strong>
                        </td>
                        <td>
                            <span class="badge bg-secondary" th:text="${p.periodType.displayName}">KLTN</span>
                        </td>
                        <td>
                            <small class="d-block" th:text="${#temporals.format(p.teacherStartDate, 'dd/MM/yyyy')}">Start</small>
                            <small class="text-muted" th:text="${#temporals.format(p.studentEndDate, 'dd/MM/yyyy')}">End</small>
                        </td>
                        <td>
                            <small class="d-block" th:text="${#temporals.format(p.teacherStartDate, 'dd/MM/yyyy HH:mm')}">Start</small>
                            <small class="text-muted" th:text="${#temporals.format(p.teacherEndDate, 'dd/MM/yyyy HH:mm')}">End</small>
                        </td>
                        <td>
                            <small class="d-block" th:if="${p.approvalStartDate != null}" th:text="${#temporals.format(p.approvalStartDate, 'dd/MM/yyyy HH:mm')}">Start</small>
                            <small class="text-muted" th:if="${p.approvalEndDate != null}" th:text="${#temporals.format(p.approvalEndDate, 'dd/MM/yyyy HH:mm')}">End</small>
                            <small class="text-muted" th:if="${p.approvalStartDate == null}">Chưa thiết lập</small>
                        </td>
                        <td>
                            <small class="d-block" th:text="${#temporals.format(p.studentStartDate, 'dd/MM/yyyy HH:mm')}">Start</small>
                            <small class="text-muted" th:text="${#temporals.format(p.studentEndDate, 'dd/MM/yyyy HH:mm')}">End</small>
                        </td>
                        <td>
                            <span th:replace="~{fragments/components :: statusBadge(${p.status.displayName}, 'info')}">DRAFT</span>
                        </td>
                        <td class="text-end">
                            <a th:href="@{/admin/periods/{id}/edit(id=${p.id})}" class="btn btn-sm btn-outline-secondary me-1">
                                <i class="bi bi-pencil"></i> Sửa
                            </a>
                            <div class="btn-group">
                                <button type="button" class="btn btn-sm btn-outline-primary dropdown-toggle" data-bs-toggle="dropdown">
                                    Đổi Trạng thái
                                </button>
                                <ul class="dropdown-menu dropdown-menu-end">
                                    <li>
                                        <form th:action="@{/admin/periods/{id}/status(id=${p.id})}" method="post">
                                            <input type="hidden" name="status" value="PHASE1_TEACHER_REG">
                                            <button type="submit" class="dropdown-item">Mở Phase 1 (GV đăng ký)</button>
                                        </form>
                                    </li>
                                    <li>
                                        <form th:action="@{/admin/periods/{id}/status(id=${p.id})}" method="post">
                                            <input type="hidden" name="status" value="PHASE1_DEAN_REVIEW">
                                            <button type="submit" class="dropdown-item">Mở giai đoạn Khoa duyệt</button>
                                        </form>
                                    </li>
                                    <li>
                                        <form th:action="@{/admin/periods/{id}/status(id=${p.id})}" method="post">
                                            <input type="hidden" name="status" value="PUBLISHED_TOPICS">
                                            <button type="submit" class="dropdown-item">Công bố Danh sách Đề tài</button>
                                        </form>
                                    </li>
                                    <li>
                                        <form th:action="@{/admin/periods/{id}/status(id=${p.id})}" method="post">
                                            <input type="hidden" name="status" value="PHASE2_STUDENT_REG">
                                            <button type="submit" class="dropdown-item">Mở Phase 2 (SV đăng ký)</button>
                                        </form>
                                    </li>
                                    <li>
                                        <form th:action="@{/admin/periods/{id}/status(id=${p.id})}" method="post">
                                            <input type="hidden" name="status" value="DEFENSE_EVALUATION">
                                            <button type="submit" class="dropdown-item">Bắt đầu Chấm Phản biện</button>
                                        </form>
                                    </li>
                                    <li>
                                        <form th:action="@{/admin/periods/{id}/status(id=${p.id})}" method="post">
                                            <input type="hidden" name="status" value="COMPLETED">
                                            <button type="submit" class="dropdown-item text-success">Hoàn thành Đợt</button>
                                        </form>
                                    </li>
                                </ul>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <section class="card card-custom p-4 mt-4">
        <h5 class="fw-bold mb-3" data-i18n="period.calendarTitle">Lịch các giai đoạn</h5>
        <div id="periodCalendar"></div>
    </section>

    <section class="card card-custom p-4 mt-4">
        <h5 class="fw-bold mb-3" data-i18n="period.kanbanTitle">Kanban trạng thái đợt</h5>
        <div id="periodKanban"></div>
    </section>

    <div class="d-none" aria-hidden="true">
           <div th:each="p : ${periods}" data-kanban-period
               th:attr="data-id=${p.id},data-status-url=@{/admin/periods/{id}/status(id=${p.id})},data-status=${p.status.name()},data-name=${p.name},data-teacher-start=${#temporals.format(p.teacherStartDate, 'yyyy-MM-dd')},data-teacher-end=${#temporals.format(p.teacherEndDate, 'yyyy-MM-dd')},data-approval-start=${p.approvalStartDate != null ? #temporals.format(p.approvalStartDate, 'yyyy-MM-dd') : ''},data-approval-end=${p.approvalEndDate != null ? #temporals.format(p.approvalEndDate, 'yyyy-MM-dd') : ''},data-student-start=${#temporals.format(p.studentStartDate, 'yyyy-MM-dd')},data-student-end=${#temporals.format(p.studentEndDate, 'yyyy-MM-dd')}"></div>
    </div>
</div>
<th:block layout:fragment="scripts">
    <script th:src="@{/vendor/fullcalendar/all/global.js}"></script>
    <script th:src="@{/vendor/fullcalendar/themes/classic/global.js}"></script>
    <script th:src="@{/vendor/fullcalendar/locales-all/global.js}"></script>
    <script th:src="@{/vendor/sortablejs/Sortable.min.js}"></script>
    <script th:src="@{/js/period-overview.js}"></script>
</th:block>
</body>
</html>
