<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Cập Nhật Đợt Đăng Ký</title>
</head>
<body>
<div layout:fragment="content">
    <div class="mb-4">
        <h3 class="fw-bold mb-1">CẬP NHẬT ĐỢT ĐĂNG KÝ</h3>
        <p class="text-muted mb-0">Chỉnh sửa thông tin và cấu hình đợt đăng ký đề tài</p>
    </div>

    <div class="card card-custom p-4">
        <form th:action="@{/admin/periods/{id}/edit(id=${periodDTO.id})}" th:object="${periodDTO}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="row g-3">
                <div class="col-md-8">
                    <label for="name" class="form-label fw-medium">Tên Đợt Đăng Ký <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="name" th:field="*{name}" placeholder="Ví dụ: Đợt Đăng ký Khóa luận Tốt nghiệp Học kỳ 1 (2026-2027)" required>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>

                <div class="col-md-4">
                    <label for="periodType" class="form-label fw-medium">Loại Đợt Đăng Ký <span class="text-danger">*</span></label>
                    <select class="form-select" id="periodType" th:field="*{periodType}" required>
                        <option value="">-- Chọn loại hình --</option>
                        <option th:each="type : ${periodTypes}" th:value="${type}" th:text="${type.displayName}"></option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label for="teacherStartDate" class="form-label fw-medium">Bắt đầu GV Đăng ký <span class="text-danger">*</span></label>
                    <input type="datetime-local" class="form-control" id="teacherStartDate" th:field="*{teacherStartDate}" required>
                </div>

                <div class="col-md-6">
                    <label for="teacherEndDate" class="form-label fw-medium">Kết thúc GV Đăng ký <span class="text-danger">*</span></label>
                    <input type="datetime-local" class="form-control" id="teacherEndDate" th:field="*{teacherEndDate}" required>
                </div>

                <div class="col-md-6">
                    <label for="studentStartDate" class="form-label fw-medium">Bắt đầu SV Đăng ký <span class="text-danger">*</span></label>
                    <input type="datetime-local" class="form-control" id="studentStartDate" th:field="*{studentStartDate}" required>
                </div>

                <div class="col-md-6">
                    <label for="studentEndDate" class="form-label fw-medium">Kết thúc SV Đăng ký <span class="text-danger">*</span></label>
                    <input type="datetime-local" class="form-control" id="studentEndDate" th:field="*{studentEndDate}" required>
                </div>

                <div class="col-md-6">
                    <label for="reviewSubmissionDeadline" class="form-label fw-medium">
                        Hạn chót GVPB nộp điểm <small class="text-muted">(Bắt buộc với TLCN & KLTN)</small>
                    </label>
                    <input type="datetime-local" class="form-control" id="reviewSubmissionDeadline" th:field="*{reviewSubmissionDeadline}">
                </div>

                <div class="col-md-6">
                    <label for="councilReportDate" class="form-label fw-medium">
                        Ngày Báo cáo Hội đồng <small class="text-muted">(Bắt buộc với KLTN)</small>
                    </label>
                    <input type="datetime-local" class="form-control" id="councilReportDate" th:field="*{councilReportDate}">
                </div>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                <a href="/admin/periods" class="btn btn-outline-secondary px-4">Hủy bỏ</a>
                <button type="submit" class="btn btn-primary px-4">
                    <i class="bi bi-save me-1"></i> Cập Nhật Đợt
                </button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
