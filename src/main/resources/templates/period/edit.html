<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Cập Nhật Đợt Đăng Ký</title>
</head>
<body>
<div layout:fragment="content">
    <div class="mb-4">
        <div th:replace="~{fragments/components :: pageHeading('CẬP NHẬT ĐỢT ĐĂNG KÝ', 'Chỉnh sửa thông tin và cấu hình đợt đăng ký đề tài')}"></div>
    </div>

    <div class="card card-custom p-3">
        <form th:action="@{/admin/periods/{id}/edit(id=${periodDTO.id})}" th:object="${periodDTO}" method="post" data-period-schedule novalidate>
            <input type="hidden" th:field="*{id}">
            <div class="row g-3">
                <div class="col-md-8">
                    <label for="name" class="form-label fw-medium" data-i18n="period.name">Tên Đợt Đăng Ký <span class="text-danger" data-required-marker>*</span></label>
                    <input type="text" class="form-control" id="name" th:field="*{name}" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''" placeholder="Ví dụ: Đợt Đăng ký Khóa luận Tốt nghiệp Học kỳ 1 (2026-2027)" required>
                </div>

                <div class="col-md-4">
                    <label for="periodType" class="form-label fw-medium" data-i18n="period.type">Loại Đợt Đăng Ký <span class="text-danger" data-required-marker>*</span></label>
                    <select class="form-select" id="periodType" th:field="*{periodType}" th:classappend="${#fields.hasErrors('periodType')} ? 'is-invalid' : ''" required>
                        <option value="" data-i18n="common.selectType">-- Chọn loại hình --</option>
                        <option th:each="type : ${periodTypes}" th:value="${type}" th:text="${type.displayName}"></option>
                    </select>
                </div>

                <div class="col-12">
                    <div class="small text-muted"><strong data-i18n="period.totalWindow">Toàn đợt đăng ký:</strong> <span id="periodTotalWindow" data-i18n="period.chooseWindow">Chọn ngày bắt đầu GV và kết thúc SV</span></div>
                </div>

                <div class="col-12"><h5 class="mb-0" data-i18n="period.teacherWindow">Thời gian Giáo viên đăng ký đề tài</h5></div>
                <div class="col-md-6">
                    <label for="teacherStartDate" class="form-label fw-medium" data-i18n="period.teacherStart">Bắt đầu GV đăng ký <span class="text-danger" data-required-marker>*</span></label>
                    <input type="text" class="form-control period-date-input" th:classappend="${#fields.hasErrors('teacherStartDate')} ? 'is-invalid' : ''" id="teacherStartDate" name="teacherStartDate" aria-label="Bắt đầu GV đăng ký" th:value="${periodDTO.teacherStartDate != null ? #temporals.format(periodDTO.teacherStartDate, 'dd/MM/yyyy HH:mm') : ''}" data-period-date-picker autocomplete="off" required>
                </div>

                <div class="col-md-6">
                    <label for="teacherEndDate" class="form-label fw-medium" data-i18n="period.teacherEnd">Kết thúc GV đăng ký <span class="text-danger" data-required-marker>*</span></label>
                    <input type="text" class="form-control period-date-input" th:classappend="${#fields.hasErrors('teacherEndDate')} ? 'is-invalid' : ''" id="teacherEndDate" name="teacherEndDate" aria-label="Kết thúc GV đăng ký" th:value="${periodDTO.teacherEndDate != null ? #temporals.format(periodDTO.teacherEndDate, 'dd/MM/yyyy HH:mm') : ''}" data-period-date-picker autocomplete="off" required>
                </div>

                <div class="col-12"><h5 class="mb-0" data-i18n="period.approvalWindow">Thời gian Khoa duyệt đề tài</h5></div>
                <div class="col-md-6">
                    <label for="approvalStartDate" class="form-label fw-medium" data-i18n="period.approvalStart">Bắt đầu Khoa duyệt <span class="text-danger" data-required-marker>*</span></label>
                    <input type="text" class="form-control period-date-input" th:classappend="${#fields.hasErrors('approvalStartDate')} ? 'is-invalid' : ''" id="approvalStartDate" name="approvalStartDate" aria-label="Bắt đầu Khoa duyệt" th:value="${periodDTO.approvalStartDate != null ? #temporals.format(periodDTO.approvalStartDate, 'dd/MM/yyyy HH:mm') : ''}" data-period-date-picker autocomplete="off" required>
                </div>
                <div class="col-md-6">
                    <label for="approvalEndDate" class="form-label fw-medium" data-i18n="period.approvalEnd">Kết thúc Khoa duyệt <span class="text-danger" data-required-marker>*</span></label>
                    <input type="text" class="form-control period-date-input" th:classappend="${#fields.hasErrors('approvalEndDate')} ? 'is-invalid' : ''" id="approvalEndDate" name="approvalEndDate" aria-label="Kết thúc Khoa duyệt" th:value="${periodDTO.approvalEndDate != null ? #temporals.format(periodDTO.approvalEndDate, 'dd/MM/yyyy HH:mm') : ''}" data-period-date-picker autocomplete="off" required>
                </div>

                <div class="col-12"><h5 class="mb-0" data-i18n="period.studentWindow">Thời gian Sinh viên đăng ký đề tài</h5></div>
                <div class="col-md-6">
                    <label for="studentStartDate" class="form-label fw-medium" data-i18n="period.studentStart">Bắt đầu SV đăng ký <span class="text-danger" data-required-marker>*</span></label>
                    <input type="text" class="form-control period-date-input" th:classappend="${#fields.hasErrors('studentStartDate')} ? 'is-invalid' : ''" id="studentStartDate" name="studentStartDate" aria-label="Bắt đầu SV đăng ký" th:value="${periodDTO.studentStartDate != null ? #temporals.format(periodDTO.studentStartDate, 'dd/MM/yyyy HH:mm') : ''}" data-period-date-picker autocomplete="off" required>
                </div>

                <div class="col-md-6">
                    <label for="studentEndDate" class="form-label fw-medium" data-i18n="period.studentEnd">Kết thúc SV đăng ký <span class="text-danger" data-required-marker>*</span></label>
                    <input type="text" class="form-control period-date-input" th:classappend="${#fields.hasErrors('studentEndDate')} ? 'is-invalid' : ''" id="studentEndDate" name="studentEndDate" aria-label="Kết thúc SV đăng ký" th:value="${periodDTO.studentEndDate != null ? #temporals.format(periodDTO.studentEndDate, 'dd/MM/yyyy HH:mm') : ''}" data-period-date-picker autocomplete="off" required>
                </div>

                <!-- <div class="col-12"><div class="small text-danger" data-schedule-error role="alert" aria-live="polite"></div></div> -->

                <div class="col-md-6">
                    <label for="reviewSubmissionDeadline" class="form-label fw-medium" data-i18n="period.reviewDeadline">Hạn chót GVPB nộp điểm (Bắt buộc với TLCN &amp; KLTN) <span class="text-danger" data-required-marker hidden>*</span></label>
                    <input type="text" class="form-control period-date-input" th:classappend="${#fields.hasErrors('reviewSubmissionDeadline')} ? 'is-invalid' : ''" id="reviewSubmissionDeadline" name="reviewSubmissionDeadline" aria-label="Hạn chót GVPB nộp điểm" th:value="${periodDTO.reviewSubmissionDeadline != null ? #temporals.format(periodDTO.reviewSubmissionDeadline, 'dd/MM/yyyy HH:mm') : ''}" data-period-date-picker autocomplete="off">
                </div>

                <div class="col-md-6">
                    <label for="councilReportDate" class="form-label fw-medium" data-i18n="period.councilDate">Ngày báo cáo Hội đồng (Bắt buộc với KLTN) <span class="text-danger" data-required-marker hidden>*</span></label>
                    <input type="text" class="form-control period-date-input" th:classappend="${#fields.hasErrors('councilReportDate')} ? 'is-invalid' : ''" id="councilReportDate" name="councilReportDate" aria-label="Ngày báo cáo Hội đồng" th:value="${periodDTO.councilReportDate != null ? #temporals.format(periodDTO.councilReportDate, 'dd/MM/yyyy HH:mm') : ''}" data-period-date-picker autocomplete="off">
                </div>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                <a href="/admin/periods" class="btn btn-outline-secondary px-4" data-i18n="common.cancel">Hủy bỏ</a>
                <button type="submit" class="btn btn-primary px-4">
                    <i class="bi bi-save me-1"></i><span data-i18n="period.update">Cập Nhật Đợt</span>
                </button>
            </div>
        </form>
    </div>
</div>
<th:block layout:fragment="scripts">
    <script th:src="@{/js/period-date-picker.js(v=6)}"></script>
    <script th:src="@{/js/period-schedule.js}"></script>
</th:block>
</body>
</html>
