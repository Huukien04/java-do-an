<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      class="wa-theme-default wa-palette-default wa-brand-blue"
      data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - Hệ thống Quản lý Đề tài Khoa CNTT">Hệ thống Quản lý Đề tài Khoa CNTT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://ka-f.webawesome.com/webawesome@3.14.0/styles/themes/default.css" rel="stylesheet">
    <script type="module" src="https://ka-f.webawesome.com/webawesome@3.14.0/webawesome.loader.js"></script>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/components.css(v=5)}">
    <link rel="icon" type="image/png" th:href="@{/images/favicon.png}">
    <style>
        .app-sidebar .brand-mark.brand-mark-logo { padding: 0; background: none; overflow: hidden; }
        .app-sidebar .brand-mark.brand-mark-logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    </style>
    <script th:src="@{/js/theme-boot.js}"></script>
</head>
<body>
<div class="app-shell">
    <aside class="app-sidebar" id="appSidebar">
        <a class="brand" href="/dashboard">
            <span class="brand-mark brand-mark-logo"><img th:src="@{/images/logo.png}" alt="Logo Khoa CNTT"></span>
            <span>
                <span class="brand-title d-block">Khoa CNTT</span>
                <span class="brand-sub">Quản lý đề tài</span>
            </span>
        </a>
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    </aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <div class="app-main">
        <div th:replace="~{fragments/navbar :: navbar}"></div>
        <div class="app-content">
            <div th:replace="~{fragments/alert :: alert}"></div>
            <div layout:fragment="content"></div>
        </div>
        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
</div>

<!-- Hop thoai xac nhan dung chung (appConfirm - static/js/confirm-dialog.js) -->
<div class="modal fade" id="appConfirmModal" tabindex="-1" aria-labelledby="appConfirmTitle"
     aria-describedby="appConfirmMessage" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered app-confirm-dialog">
        <div class="modal-content app-confirm-content">
            <div class="app-confirm-icon" aria-hidden="true"><i class="bi bi-exclamation-triangle"></i></div>
            <h5 class="app-confirm-title" id="appConfirmTitle">Xác nhận thao tác</h5>
            <p class="app-confirm-message" id="appConfirmMessage"></p>
            <div class="app-confirm-actions">
                <button type="button" class="btn app-confirm-btn app-confirm-btn-cancel" data-bs-dismiss="modal">Không, giữ lại</button>
                <button type="button" class="btn app-confirm-btn app-confirm-btn-ok">Có, tiếp tục</button>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/vendor/apexcharts/apexcharts.min.js}"></script>
<script th:src="@{/js/theme.js}"></script>
<script th:src="@{/js/form-validation.js}"></script>
<script th:src="@{/js/i18n.js}"></script>
<script th:src="@{/js/ui-components.js}"></script>
<script th:src="@{/js/confirm-dialog.js}"></script>
<script th:src="@{/js/notifications-live.js}"></script>
<script>
    (function () {
        const path = window.location.pathname;
        let activeLink = null;
        document.querySelectorAll('.sidebar-nav a.nav-link').forEach(function (link) {
            const href = link.getAttribute('href');
            if (!href) return;
            const matches = href === '/dashboard'
                ? path === '/' || path === '/dashboard'
                : path === href || path.startsWith(href + '/');
            if (matches && (!activeLink || href.length > activeLink.getAttribute('href').length)) {
                activeLink = link;
            }
        });
        if (activeLink) activeLink.classList.add('active');
        const sidebar = document.getElementById('appSidebar');
        const backdrop = document.getElementById('sidebarBackdrop');
        const toggle = document.getElementById('sidebarToggle');
        function closeSidebar() {
            sidebar.classList.remove('open');
            backdrop.classList.remove('show');
        }
        if (toggle) toggle.addEventListener('click', function () {
            sidebar.classList.toggle('open');
            backdrop.classList.toggle('show');
        });
        if (backdrop) backdrop.addEventListener('click', closeSidebar);
    })();
</script>
<th:block layout:fragment="scripts"></th:block>
</body>
</html>
