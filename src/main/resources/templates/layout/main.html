<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - Hệ thống Quản lý Đề tài Khoa CNTT">Hệ thống Quản lý Đề tài Khoa CNTT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <script th:src="@{/js/theme-boot.js}"></script>
</head>
<body>
<div class="app-shell">
    <aside class="app-sidebar" id="appSidebar">
        <a class="brand" href="/dashboard">
            <span class="brand-mark"><i class="bi bi-mortarboard-fill"></i></span>
            <span>
                <span class="brand-title d-block">Khoa CNTT</span>
                <span class="brand-sub">Quản lý đề tài</span>
            </span>
        </a>
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        <div class="sidebar-footer">
            <form th:action="@{/logout}" method="post">
                <button type="submit">
                    <i class="bi bi-box-arrow-left"></i> Đăng xuất
                </button>
            </form>
        </div>
    </aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <div class="app-main">
        <div th:replace="~{fragments/navbar :: navbar}"></div>
        <div class="app-content">
            <div th:replace="~{fragments/alert :: alert}"></div>
            <div layout:fragment="content"></div>
        </div>
        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/theme.js}"></script>
<script>
    (function () {
        const path = window.location.pathname;
        document.querySelectorAll('.sidebar-nav a.nav-link').forEach(function (link) {
            const href = link.getAttribute('href');
            if (!href) return;
            if (href === '/dashboard') {
                if (path === '/' || path === '/dashboard') link.classList.add('active');
                return;
            }
            if (path === href || path.startsWith(href + '/')) link.classList.add('active');
        });
        const sidebar = document.getElementById('appSidebar');
        const backdrop = document.getElementById('sidebarBackdrop');
        const toggle = document.getElementById('sidebarToggle');
        function closeSidebar() {
            sidebar.classList.remove('open');
            backdrop.classList.remove('show');
        }
        if (toggle) toggle.addEventListener('click', function () {
            sidebar.classList.toggle('open');
            backdrop.classList.toggle('show');
        });
        if (backdrop) backdrop.addEventListener('click', closeSidebar);
    })();
</script>
<th:block layout:fragment="scripts"></th:block>
</body>
</html>
