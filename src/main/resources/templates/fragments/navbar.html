<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="navbar" class="topbar">
    <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="Mở menu">
        <i class="bi bi-list"></i>
    </button>
    <form class="topbar-search" action="/topics" method="get" role="search">
        <i class="bi bi-search"></i>
        <input type="search" name="q" placeholder="Tìm kiếm đề tài, nhóm, thông báo...">
    </form>
    <div class="topbar-actions">
        <button type="button" class="icon-btn" id="themeToggle" aria-label="Chuyển giao diện" title="Chuyển giao diện sáng">
            <i class="bi bi-sun" id="themeToggleIcon"></i>
        </button>
        <a class="icon-btn" href="/notifications" title="Thông báo">
            <i class="bi bi-bell"></i>
        </a>
        <div class="user-chip" sec:authorize="isAuthenticated()">
            <span class="avatar">
                <span sec:authorize="hasRole('ADMIN')">TK</span>
                <span sec:authorize="hasRole('TEACHER')">GV</span>
                <span sec:authorize="hasRole('STUDENT')">SV</span>
            </span>
            <span>
                <span class="d-block" sec:authentication="name">User</span>
                <span class="d-block" style="font-size:0.68rem;color:#9a9aa8;font-weight:500;">
                    <span sec:authorize="hasRole('ADMIN')">Trưởng khoa</span>
                    <span sec:authorize="hasRole('TEACHER')">Giảng viên</span>
                    <span sec:authorize="hasRole('STUDENT')">Sinh viên</span>
                </span>
            </span>
            <i class="bi bi-chevron-down" style="font-size:0.7rem;color:#9a9aa8;"></i>
        </div>
    </div>
</header>
</body>
</html>
