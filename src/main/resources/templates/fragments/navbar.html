<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top py-2 px-3">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold d-flex align-items-center" href="/dashboard">
            <i class="bi bi-mortarboard-fill me-2 fs-4"></i>
            <span>HCMUTE TOPIC MANAGEMENT</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item me-3 text-white d-none d-md-block" sec:authorize="isAuthenticated()">
                    <!-- Admin Badge -->
                    <span sec:authorize="hasRole('ADMIN')" class="badge bg-amber text-dark px-3 py-2 rounded-pill shadow-sm" style="background-color: #f59e0b; color: #ffffff !important;">
                        <i class="bi bi-shield-lock-fill me-1"></i>
                        <span sec:authentication="name">User</span> (TRƯỞNG KHOA)
                    </span>
                    <!-- Teacher Badge -->
                    <span sec:authorize="hasRole('TEACHER')" class="badge bg-light text-success px-3 py-2 rounded-pill shadow-sm">
                        <i class="bi bi-person-badge-fill me-1"></i>
                        <span sec:authentication="name">User</span> (GIẢNG VIÊN)
                    </span>
                    <!-- Student Badge -->
                    <span sec:authorize="hasRole('STUDENT')" class="badge bg-light text-primary px-3 py-2 rounded-pill shadow-sm">
                        <i class="bi bi-mortarboard-fill me-1"></i>
                        <span sec:authentication="name">User</span> (SINH VIÊN)
                    </span>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-light btn-sm rounded-pill px-3">
                            <i class="bi bi-box-arrow-right me-1"></i> Đăng xuất
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>
</body>
</html>
