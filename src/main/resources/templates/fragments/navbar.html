<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="navbar" class="topbar">
    <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="Mở menu">
        <i class="bi bi-list"></i>
    </button>
    <form class="topbar-search" action="/topics" method="get" role="search">
        <i class="bi bi-search"></i>
        <input type="search" name="q" placeholder="Tìm kiếm đề tài, nhóm, thông báo...">
    </form>
    <div class="topbar-actions">
        <div class="language-switch" role="group" aria-label="Language" data-i18n-aria-label="common.language">
            <button type="button" class="language-option" data-language="vi" aria-label="Tiếng Việt" title="Tiếng Việt">
                <img src="https://flagcdn.com/w40/vn.png" alt="VI" width="24" height="16">
            </button>
            <button type="button" class="language-option" data-language="en" aria-label="English" title="English">
                <img src="https://flagcdn.com/w40/us.png" alt="EN" width="24" height="16">
            </button>
        </div>
        <button type="button" class="icon-btn" id="themeToggle" aria-label="Chuyển giao diện" title="Chuyển giao diện sáng">
            <i class="bi bi-sun" id="themeToggleIcon"></i>
        </button>
        <a class="icon-btn" href="/notifications" title="Thông báo">
            <i class="bi bi-bell"></i>
        </a>
        <div class="dropdown" sec:authorize="isAuthenticated()">
            <button type="button" class="user-chip" data-bs-toggle="dropdown" aria-expanded="false">
                <span class="avatar">
                    <span sec:authorize="hasRole('ADMIN')">AD</span>
                    <span sec:authorize="hasRole('TEACHER')">GV</span>
                    <span sec:authorize="hasRole('STUDENT')">SV</span>
                </span>
                <span>
                    <span class="d-block" sec:authentication="name">User</span>
                    <span class="d-block" style="font-size:0.68rem;color:#9a9aa8;font-weight:500;">
                        <span sec:authorize="hasRole('ADMIN')">Trưởng khoa</span>
                        <span sec:authorize="hasRole('TEACHER')">Giảng viên</span>
                        <span sec:authorize="hasRole('STUDENT')">Sinh viên</span>
                    </span>
                </span>
                <i class="bi bi-chevron-down" style="font-size:0.7rem;color:#9a9aa8;"></i>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
                <li>
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="dropdown-item">
                            <i class="bi bi-box-arrow-left me-2"></i>Đăng xuất
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</header>
</body>
</html>
