<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="alert" class="ui-toast-stack" aria-live="polite">
     <th:block th:if="${successMessage}">
          <div th:replace="~{fragments/components :: toast('appSuccessToast', 'Thành công', ${successMessage}, 'success', true)}"></div>
     </th:block>
     <th:block th:if="${errorMessage}">
          <div th:replace="~{fragments/components :: toast('appErrorToast', 'Có lỗi xảy ra', ${errorMessage}, 'danger', true)}"></div>
     </th:block>
</div>
</body>
</html>
