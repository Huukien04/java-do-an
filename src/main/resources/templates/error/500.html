<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Lỗi Hệ thống</title>
</head>
<body>
<div layout:fragment="content">
    <div class="text-center py-5">
        <i class="bi bi-exclamation-triangle display-1 text-danger mb-3 d-block"></i>
        <h2 class="fw-bold text-dark mb-2" th:text="${errorTitle != null ? errorTitle : 'Đã xảy ra lỗi hệ thống'}">Lỗi Hệ thống</h2>
        <p class="text-muted mb-4 fs-5" th:text="${errorMessage}">Đã xảy ra sự cố trong quá trình xử lý yêu cầu.</p>
        <a href="/dashboard" class="btn btn-primary rounded-pill px-4"><i class="bi bi-house me-1"></i> Quay về Trang chủ Dashboard</a>
    </div>
</div>
</body>
</html>
