<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/main}">
<head>
    <title>Thông báo Khoa CNTT</title>
</head>
<body>
<div layout:fragment="content">
    <div class="notification-page-header">
        <nav class="notification-tabs" aria-label="Loại thông báo">
            <a th:href="@{/notifications(view='general')}"
               th:classappend="${view == 'general'} ? ' active' : ''"
               th:attr="aria-current=${view == 'general'} ? 'page' : null">Thông báo chung</a>
            <a th:href="@{/notifications(view='personal')}"
               th:classappend="${view == 'personal'} ? ' active' : ''"
               th:attr="aria-current=${view == 'personal'} ? 'page' : null">Thông báo cá nhân</a>
        </nav>
        <a sec:authorize="hasRole('ADMIN')" href="/notifications/create" class="btn btn-primary">
            <i class="bi bi-plus-circle me-1"></i> Đăng thông báo
        </a>
    </div>

    <section class="card card-custom notification-list-card">
        <label class="notification-search">
            <i class="bi bi-search" aria-hidden="true"></i>
            <input type="search" placeholder="Tìm kiếm thông báo" aria-label="Tìm kiếm thông báo"
                   data-notification-search>
        </label>

        <div class="table-responsive">
            <table class="table notification-table align-middle mb-0">
                <thead>
                <tr>
                    <th scope="col">Tiêu đề</th>
                    <th scope="col">Người gửi</th>
                    <th scope="col">Thời gian gửi</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="n : ${notifications}" data-notification-row>
                    <td>
                        <a class="notification-title-link"
                           th:href="@{/notifications/{id}(id=${n.id}, view=${view})}"
                           th:text="${n.title}">Tiêu đề thông báo</a>
                    </td>
                    <td th:text="${n.createdByFullName}">Người gửi</td>
                    <td th:text="${#temporals.format(n.createdAt, 'dd/MM/yyyy')}">01/01/2026</td>
                </tr>
                <tr th:if="${notifications.empty}" class="notification-empty-row">
                    <td colspan="3">
                        <div th:replace="~{fragments/components :: emptyState('bi-bell', 'Chưa có thông báo nào.', 'Thông báo mới sẽ xuất hiện tại đây.')}"></div>
                    </td>
                </tr>
                <tr hidden data-notification-no-results>
                    <td colspan="3" class="text-center text-muted py-4">Không tìm thấy thông báo phù hợp.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</div>
<th:block layout:fragment="scripts">
    <script>
        (function () {
            const search = document.querySelector('[data-notification-search]');
            if (!search) return;
            const rows = Array.from(document.querySelectorAll('[data-notification-row]'));
            const noResults = document.querySelector('[data-notification-no-results]');
            search.addEventListener('input', function () {
                const query = search.value.trim().toLocaleLowerCase();
                let visibleCount = 0;
                rows.forEach(function (row) {
                    const matches = row.textContent.toLocaleLowerCase().includes(query);
                    row.hidden = !matches;
                    if (matches) visibleCount++;
                });
                if (noResults) noResults.hidden = visibleCount > 0 || rows.length === 0;
            });
        })();
    </script>
</th:block>
</body>
</html>
