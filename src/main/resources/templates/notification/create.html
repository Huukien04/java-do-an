<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Đăng Thông báo Mới</title>
</head>
<body>
<div layout:fragment="content">
    <div class="mb-4">
        <div th:replace="~{fragments/components :: pageHeading('ĐĂNG THÔNG BÁO MỚI', 'Cung cấp thông tin kịp thời tới Giảng viên và Sinh viên toàn Khoa')}"></div>
    </div>

    <div class="card card-custom p-3">
        <form th:action="@{/notifications/create}" th:object="${notificationDTO}" method="post">
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="type" class="form-label fw-medium">Loại Thông báo <span class="text-danger">*</span></label>
                    <select class="form-select" id="type" th:field="*{type}" required>
                        <option value="">-- Chọn loại --</option>
                        <option th:each="t : ${notificationTypes}" th:value="${t}" th:text="${t.displayName}"></option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label for="targetRole" class="form-label fw-medium">Đối tượng nhận thông báo <span class="text-danger">*</span></label>
                    <select class="form-select" id="targetRole" th:field="*{targetRole}" required>
                        <option value="ALL">Thông báo chung (tất cả)</option>
                        <option value="ROLE_TEACHER">Thông báo chung (giảng viên)</option>
                        <option value="ROLE_STUDENT">Thông báo chung (sinh viên)</option>
                        <option value="INDIVIDUAL">Thông báo cá nhân</option>
                    </select>
                </div>

                <div class="col-12" id="individualRecipients" hidden>
                    <label for="targetUserIds" class="form-label fw-medium">Người nhận <span class="text-danger">*</span></label>
                    <select class="form-select notification-recipient-select" id="targetUserIds"
                            th:field="*{targetUserIds}" multiple>
                        <option th:each="user : ${users}" th:value="${user.id}"
                                th:text="${user.fullName + ' (' + user.username + ') - ' + user.role.name.displayName}"></option>
                    </select>
                    <small class="form-text text-muted">Có thể chọn nhiều tài khoản.</small>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('targetUserIds')}"
                         th:errors="*{targetUserIds}"></div>
                </div>

                <div class="col-12">
                    <label for="title" class="form-label fw-medium">Tiêu đề Thông báo <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="title" th:field="*{title}" placeholder="Nhập tiêu đề thông báo..." required>
                </div>

                <div class="col-12">
                    <label for="content" class="form-label fw-medium">Nội dung Chi tiết <span class="text-danger">*</span></label>
                    <textarea class="form-control" id="content" th:field="*{content}" rows="6" placeholder="Nội dung thông báo chi tiết..." required></textarea>
                </div>

                <div class="col-12">
                    <label for="periodId" class="form-label fw-medium">Liên kết Đợt đăng ký (Nếu có)</label>
                    <select class="form-select" id="periodId" th:field="*{periodId}">
                        <option value="">-- Không liên kết đợt --</option>
                        <option th:each="p : ${periods}" th:value="${p.id}" th:text="${p.name}"></option>
                    </select>
                </div>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                <a href="/notifications" class="btn btn-outline-secondary px-4">Hủy bỏ</a>
                <button type="submit" class="btn btn-primary px-4"><i class="bi bi-megaphone me-1"></i> Phát hành Thông báo</button>
            </div>
        </form>
    </div>
</div>
<th:block layout:fragment="scripts">
    <script>
        (function () {
            const audience = document.getElementById('targetRole');
            const recipientField = document.getElementById('individualRecipients');
            if (!audience || !recipientField) return;
            function updateRecipientVisibility() {
                recipientField.hidden = audience.value !== 'INDIVIDUAL';
            }
            audience.addEventListener('change', updateRecipientVisibility);
            updateRecipientVisibility();
        })();
    </script>
</th:block>
</body>
</html>
