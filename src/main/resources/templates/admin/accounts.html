<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Quản lý tài khoản</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div th:replace="~{fragments/components :: pageHeading('QUẢN LÝ TÀI KHOẢN', 'Tạo, cập nhật và quản lý tài khoản người dùng')}"></div>
        <a class="btn btn-primary" th:href="@{/admin/accounts/new}">
            <i class="bi bi-person-plus me-1"></i>Thêm tài khoản
        </a>
    </div>

    <div class="card card-custom overflow-hidden">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-primary">
                <tr>
                    <th>Tên đăng nhập</th>
                    <th>Họ tên</th>
                    <th>Email</th>
                    <th>Vai trò</th>
                    <th>Trạng thái</th>
                    <th class="text-end">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${accounts.empty}">
                    <td colspan="6" class="text-center text-muted py-4">Chưa có tài khoản.</td>
                </tr>
                <tr th:each="account : ${accounts}">
                    <td class="fw-semibold" th:text="${account.username}">username</td>
                    <td th:text="${account.fullName}">Họ tên</td>
                    <td th:text="${account.email}">email</td>
                    <td th:text="${account.role.name.displayName}">Vai trò</td>
                    <td>
                        <span class="badge" th:classappend="${account.enabled ? 'bg-success' : 'bg-secondary'}"
                              th:text="${account.enabled ? 'Đang hoạt động' : 'Đã khóa'}">Hoạt động</span>
                    </td>
                    <td class="text-end">
    <!-- Dùng d-flex để bật Flexbox, justify-content-end để đẩy sang phải -->
    <!-- flex-column (mặc định xếp dọc thành 2 hàng) và sm:flex-row (màn hình từ sm trở lên sẽ xếp ngang thành 2 cột) -->
    <!-- gap-2 để tạo khoảng cách tự động giữa 2 nút -->
                        <div class="d-flex flex-column flex-sm-row justify-content-end gap-2 align-items-end align-items-sm-center">
                            
                            <a class="btn btn-sm btn-outline-primary text-nowrap"
                            th:href="@{/admin/accounts/{id}/edit(id=${account.id})}">Sửa</a>
                            
                            <form class="m-0" method="post"
                                th:action="@{/admin/accounts/{id}/delete(id=${account.id})}"
                                data-confirm="Bạn sắp xoá tài khoản này. Tài khoản đang được sử dụng sẽ không thể xoá." 
                                data-confirm-title="Xoá tài khoản" 
                                data-confirm-ok="Có, xoá luôn!">
                                <button class="btn btn-sm btn-outline-danger text-nowrap w-100" type="submit">Xóa</button>
                            </form>
                            
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
