<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Quản lý tài khoản</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div th:replace="~{fragments/components :: pageHeading('QUẢN LÝ TÀI KHOẢN', 'Tạo, cập nhật và quản lý tài khoản người dùng')}"></div>
        <a class="btn btn-primary" th:href="@{/admin/accounts/new}">
            <i class="bi bi-person-plus me-1"></i>Thêm tài khoản
        </a>
    </div>

    <div class="card card-custom p-3">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Tên đăng nhập</th>
                    <th>Họ tên</th>
                    <th>Email</th>
                    <th>Vai trò</th>
                    <th>Trạng thái</th>
                    <th class="text-end">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${accounts.empty}">
                    <td colspan="6" class="text-center text-muted py-4">Chưa có tài khoản.</td>
                </tr>
                <tr th:each="account : ${accounts}">
                    <td class="fw-semibold" th:text="${account.username}">username</td>
                    <td th:text="${account.fullName}">Họ tên</td>
                    <td th:text="${account.email}">email</td>
                    <td th:text="${account.role.name.displayName}">Vai trò</td>
                    <td>
                        <span class="badge" th:classappend="${account.enabled ? 'bg-success' : 'bg-secondary'}"
                              th:text="${account.enabled ? 'Đang hoạt động' : 'Đã khóa'}">Hoạt động</span>
                    </td>
                    <td class="text-end text-nowrap">
                        <a class="btn btn-sm btn-outline-primary"
                           th:href="@{/admin/accounts/{id}/edit(id=${account.id})}">Sửa</a>
                        <form class="d-inline" method="post"
                              th:action="@{/admin/accounts/{id}/delete(id=${account.id})}"
                              onsubmit="return confirm('Xóa tài khoản này? Tài khoản đang được sử dụng sẽ không thể xóa.')">
                            <button class="btn btn-sm btn-outline-danger" type="submit">Xóa</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
