<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title th:text="${formTitle}">Bộ môn</title>
</head>
<body>
<div layout:fragment="content">
    <div class="mb-4">
        <div th:replace="~{fragments/components :: pageHeading(${formTitle}, 'Thông tin bộ môn')}"></div>
    </div>
    <div class="card card-custom p-4">
        <form method="post" th:action="${formAction}" th:object="${departmentForm}">
            <div class="mb-3">
                <label for="code" class="form-label">Mã bộ môn</label>
                <input id="code" class="form-control" th:field="*{code}" maxlength="20" required>
            </div>
            <div class="mb-3">
                <label for="name" class="form-label">Tên bộ môn</label>
                <input id="name" class="form-control" th:field="*{name}" maxlength="100" required>
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">Mô tả</label>
                <textarea id="description" class="form-control" th:field="*{description}" rows="3"></textarea>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-primary" type="submit">Lưu</button>
                <a class="btn btn-outline-secondary" th:href="@{/admin/departments}">Hủy</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
