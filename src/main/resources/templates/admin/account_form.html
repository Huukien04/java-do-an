<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title th:text="${formTitle}">Tài khoản</title>
</head>
<body>
<div layout:fragment="content">
    <div class="mb-4">
        <div th:replace="~{fragments/components :: pageHeading(${formTitle}, 'Thông tin tài khoản và hồ sơ người dùng')}"></div>
    </div>
    <div class="card card-custom p-4">
        <form method="post" th:action="${formAction}" th:object="${accountForm}">
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="username" class="form-label">Tên đăng nhập</label>
                    <input id="username" class="form-control" th:field="*{username}" maxlength="50" required>
                </div>
                <div class="col-md-6">
                    <label for="password" class="form-label">Mật khẩu <span th:if="${accountForm.username == null}">*</span></label>
                    <input id="password" type="password" class="form-control" th:field="*{password}"
                           th:required="${accountForm.username == null}"
                           th:placeholder="${accountForm.username == null ? '' : 'Để trống nếu không đổi mật khẩu'}">
                </div>
                <div class="col-md-6">
                    <label for="fullName" class="form-label">Họ và tên</label>
                    <input id="fullName" class="form-control" th:field="*{fullName}" maxlength="100" required>
                </div>
                <div class="col-md-6">
                    <label for="email" class="form-label">Email</label>
                    <input id="email" type="email" class="form-control" th:field="*{email}" maxlength="100" required>
                </div>
                <div class="col-md-6">
                    <label for="phone" class="form-label">Số điện thoại</label>
                    <input id="phone" class="form-control" th:field="*{phone}" maxlength="20">
                </div>
                <div class="col-md-6">
                    <label for="roleName" class="form-label">Vai trò</label>
                    <select id="roleName" class="form-select" th:field="*{roleName}" required>
                        <option value="">-- Chọn vai trò --</option>
                        <option th:each="role : ${roles}" th:value="${role}" th:text="${role.displayName}">Vai trò</option>
                    </select>
                </div>
                <div class="col-12">
                    <div class="form-check">
                        <input id="enabled" class="form-check-input" type="checkbox" th:field="*{enabled}">
                        <label class="form-check-label" for="enabled">Tài khoản đang hoạt động</label>
                    </div>
                </div>

                <div class="col-12" id="teacherFields">
                    <hr>
                    <h6 class="fw-bold">Hồ sơ giảng viên</h6>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="teacherCode" class="form-label">Mã giảng viên</label>
                            <input id="teacherCode" class="form-control" th:field="*{teacherCode}">
                        </div>
                        <div class="col-md-6">
                            <label for="departmentTeacher" class="form-label">Bộ môn</label>
                            <select id="departmentTeacher" class="form-select" th:field="*{departmentId}">
                                <option value="">-- Chọn bộ môn --</option>
                                <option th:each="department : ${departments}" th:value="${department.id}"
                                        th:text="${department.name}">Bộ môn</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="academicRank" class="form-label">Học hàm</label>
                            <input id="academicRank" class="form-control" th:field="*{academicRank}">
                        </div>
                        <div class="col-md-6">
                            <label for="degree" class="form-label">Học vị</label>
                            <input id="degree" class="form-control" th:field="*{degree}">
                        </div>
                    </div>
                </div>

                <div class="col-12" id="studentFields">
                    <hr>
                    <h6 class="fw-bold">Hồ sơ sinh viên</h6>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="studentCode" class="form-label">Mã sinh viên</label>
                            <input id="studentCode" class="form-control" th:field="*{studentCode}">
                        </div>
                        <div class="col-md-6">
                            <label for="className" class="form-label">Lớp</label>
                            <input id="className" class="form-control" th:field="*{className}">
                        </div>
                        <div class="col-md-6">
                            <label for="academicYear" class="form-label">Niên khóa</label>
                            <input id="academicYear" class="form-control" th:field="*{academicYear}">
                        </div>
                        <div class="col-md-6">
                            <label for="departmentStudent" class="form-label">Bộ môn</label>
                            <select id="departmentStudent" class="form-select" th:field="*{departmentId}">
                                <option value="">-- Chọn bộ môn --</option>
                                <option th:each="department : ${departments}" th:value="${department.id}"
                                        th:text="${department.name}">Bộ môn</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            <div class="d-flex gap-2 mt-4">
                <button class="btn btn-primary" type="submit">Lưu tài khoản</button>
                <a class="btn btn-outline-secondary" th:href="@{/admin/accounts}">Hủy</a>
            </div>
        </form>
    </div>
</div>
<th:block layout:fragment="scripts">
    <script>
        (function () {
            const role = document.getElementById('roleName');
            const teacherFields = document.getElementById('teacherFields');
            const studentFields = document.getElementById('studentFields');
            const teacherDepartment = document.getElementById('departmentTeacher');
            const studentDepartment = document.getElementById('departmentStudent');
            function updateProfileFields() {
                const isTeacher = role.value === 'ROLE_TEACHER';
                const isStudent = role.value === 'ROLE_STUDENT';
                teacherFields.hidden = !isTeacher;
                studentFields.hidden = !isStudent;
                teacherDepartment.disabled = !isTeacher;
                studentDepartment.disabled = !isStudent;
            }
            role.addEventListener('change', updateProfileFields);
            updateProfileFields();
        })();
    </script>
</th:block>
</body>
</html>
