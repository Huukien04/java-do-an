<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Quản lý bộ môn</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div th:replace="~{fragments/components :: pageHeading('QUẢN LÝ BỘ MÔN', 'Thêm, sửa và xóa các bộ môn trong hệ thống')}"></div>
        <a class="btn btn-primary" th:href="@{/admin/departments/new}">
            <i class="bi bi-plus-lg me-1"></i>Thêm bộ môn
        </a>
    </div>

    <div class="card card-custom p-3">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Mã bộ môn</th>
                    <th>Tên bộ môn</th>
                    <th>Mô tả</th>
                    <th class="text-end">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${departments.empty}">
                    <td colspan="4" class="text-center text-muted py-4">Chưa có bộ môn.</td>
                </tr>
                <tr th:each="department : ${departments}">
                    <td class="fw-semibold" th:text="${department.code}">KTPM</td>
                    <td th:text="${department.name}">Kỹ thuật Phần mềm</td>
                    <td th:text="${department.description}">Mô tả</td>
                    <td class="text-end text-nowrap">
                        <a class="btn btn-sm btn-outline-primary"
                           th:href="@{/admin/departments/{id}/edit(id=${department.id})}">Sửa</a>
                        <form class="d-inline" method="post"
                              th:action="@{/admin/departments/{id}/delete(id=${department.id})}"
                              onsubmit="return confirm('Bạn có chắc muốn xóa bộ môn này?')">
                            <button class="btn btn-sm btn-outline-danger" type="submit">Xóa</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
