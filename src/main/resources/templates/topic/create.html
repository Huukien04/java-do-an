<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Đăng ký Đề tài Mới</title>
</head>
<body>
<div layout:fragment="content">
    <div class="mb-4">
        <h3 class="fw-bold mb-1">ĐĂNG KÝ ĐỀ TÀI MỚI</h3>
        <p class="text-muted mb-0">Dành cho Giảng viên tạo đề tài trong khoảng thời gian Phase 1</p>
    </div>

    <div class="card card-custom p-4">
        <form th:action="@{/topics/create}" th:object="${topicDTO}" method="post">
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="periodId" class="form-label fw-medium">Chọn Đợt Đăng Ký <span class="text-danger">*</span></label>
                    <select class="form-select" id="periodId" th:field="*{periodId}" required>
                        <option value="">-- Chọn đợt đang mở --</option>
                        <option th:each="p : ${periods}" th:value="${p.id}" th:text="${p.name}"></option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label for="departmentId" class="form-label fw-medium">Thuộc Bộ môn <span class="text-danger">*</span></label>
                    <select class="form-select" id="departmentId" th:field="*{departmentId}" required>
                        <option value="">-- Chọn Bộ môn --</option>
                        <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name}"></option>
                    </select>
                </div>

                <div class="col-12">
                    <label for="title" class="form-label fw-medium">Tên Đề tài <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="title" th:field="*{title}" placeholder="Nhập tên đề tài đầy đủ..." required>
                </div>

                <div class="col-12">
                    <label for="description" class="form-label fw-medium">Mô tả Nội dung Đề tài <span class="text-danger">*</span></label>
                    <textarea class="form-control" id="description" th:field="*{description}" rows="4" placeholder="Mô tả mục tiêu, bài toán cần giải quyết..." required></textarea>
                </div>

                <div class="col-12">
                    <label for="requirements" class="form-label fw-medium">Yêu cầu Yêu cầu Kỹ thuật / Công nghệ</label>
                    <textarea class="form-control" id="requirements" th:field="*{requirements}" rows="3" placeholder="Yêu cầu về kiến thức: Java, Spring Boot, MySQL..."></textarea>
                </div>

                <div class="col-md-6">
                    <label for="primaryAdvisorId" class="form-label fw-medium">Giảng viên Hướng dẫn chính (GVHD 1) <span class="text-danger">*</span></label>
                    <select class="form-select" id="primaryAdvisorId" th:field="*{primaryAdvisorId}" required>
                        <option value="">-- Chọn GVHD 1 --</option>
                        <option th:each="t : ${teachers}" th:value="${t.id}" th:text="${t.user.fullName + ' (' + t.teacherCode + ')'}"></option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label for="secondaryAdvisorId" class="form-label fw-medium">Giảng viên Hướng dẫn phụ (GVHD 2 - Tùy chọn)</label>
                    <select class="form-select" id="secondaryAdvisorId" th:field="*{secondaryAdvisorId}">
                        <option value="">-- Không có GVHD 2 --</option>
                        <option th:each="t : ${teachers}" th:value="${t.id}" th:text="${t.user.fullName + ' (' + t.teacherCode + ')'}"></option>
                    </select>
                </div>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                <a href="/topics" class="btn btn-outline-secondary px-4">Hủy bỏ</a>
                <button type="submit" class="btn btn-primary px-4"><i class="bi bi-send me-1"></i> Gửi Đăng ký Đề tài</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
