<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Hệ thống Quản lý Đề tài Khoa CNTT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #171821;
        }
        .login-card {
            background: #2b2b36;
            border-radius: 22px;
            overflow: hidden;
            box-shadow: none;
            border: 0;
        }
        .login-header {
            background: #21222c;
            color: #fff;
            padding: 2.4rem 2rem 1.8rem;
            text-align: center;
        }
        .login-header .brand-icon {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            background: #a9dfd8;
            color: #171821;
            display: grid;
            place-items: center;
            margin: 0 auto 1rem;
            font-size: 1.6rem;
        }
        .btn-login {
            background: #a9dfd8;
            color: #171821;
            border: 0;
            font-weight: 700;
            padding: 0.85rem;
            border-radius: 999px;
        }
        .btn-login:hover { background: #8fd4cb; color: #171821; }
        .credential-box {
            background: #21222c;
            border-radius: 14px;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card login-card">
                <div class="login-header">
                    <div class="brand-icon"><i class="bi bi-mortarboard-fill"></i></div>
                    <h4 class="fw-bold mb-1">Khoa Công nghệ Thông tin</h4>
                    <p class="mb-0" style="color:#9a9aa8;">Hệ thống quản lý đề tài</p>
                </div>
                <div class="card-body p-4 p-md-5">
                    <div th:if="${param.error}" class="alert alert-danger mb-4" role="alert">
                        <i class="bi bi-exclamation-circle-fill me-2"></i> Tên đăng nhập hoặc mật khẩu không chính xác!
                    </div>
                    <div th:if="${param.logout}" class="alert alert-success mb-4" role="alert">
                        <i class="bi bi-check-circle-fill me-2"></i> Bạn đã đăng xuất thành công.
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label small text-muted">Tên đăng nhập</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control py-2" id="username" name="username" placeholder="Nhập tên đăng nhập" required autofocus>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label small text-muted">Mật khẩu</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control py-2" id="password" name="password" placeholder="Nhập mật khẩu" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-login w-100 mb-4">
                            <i class="bi bi-box-arrow-in-right me-2"></i> Đăng nhập
                        </button>
                    </form>

                    <div class="p-3 credential-box">
                        <h6 class="fw-bold mb-2" style="font-size: 0.85rem; color:#a9dfd8;">
                            <i class="bi bi-key-fill me-2"></i> Tài khoản thử nghiệm
                        </h6>
                        <ul class="list-unstyled mb-0" style="font-size: 0.8rem; line-height: 1.7; color:#c9c9d4;">
                            <li>Trưởng khoa: <code>admin</code> / <code>admin123</code></li>
                            <li>Giảng viên: <code>gv_nguyenvana</code> / <code>123456</code></li>
                            <li>Sinh viên: <code>sv_nguyenvanf</code> / <code>123456</code></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
