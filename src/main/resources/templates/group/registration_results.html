<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Kết quả đăng ký đề tài</title>
    <style>
        @media print {
            .app-sidebar, .app-main > nav, .app-main > .navbar, .app-main > header,
            .app-content > .registration-filters, .registration-print-button, .app-main > footer {
                display: none !important;
            }
            .app-shell, .app-main, .app-content, .card {
                display: block !important;
                width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                box-shadow: none !important;
            }
            body { background: #fff !important; color: #000 !important; }
            .table { font-size: 11pt; }
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
            <h1 class="h3 fw-bold mb-1">Kết quả đăng ký đề tài</h1>
            <p class="text-muted mb-0">Theo dõi đề tài nhóm đã đăng ký và trạng thái xét duyệt.</p>
        </div>
        <button type="button" class="btn btn-outline-primary rounded-pill px-4 registration-print-button"
                onclick="window.print()">
            <i class="bi bi-file-earmark-pdf me-2"></i>In / lưu PDF
        </button>
    </div>

    <div class="card card-custom p-3 mb-4 registration-filters">
        <form method="get" th:action="@{/student/registrations}" class="row g-3 align-items-end">
            <div class="col-md-6 col-lg-5">
                <label for="periodId" class="form-label fw-semibold">Đợt đăng ký</label>
                <select id="periodId" name="periodId" class="form-select" onchange="this.form.submit()">
                    <option value="">Tất cả đợt</option>
                    <option th:each="period : ${periods}"
                            th:value="${period.id}"
                            th:text="${period.name}"
                            th:selected="${selectedPeriodId != null and selectedPeriodId == period.id}">
                        Đợt đăng ký
                    </option>
                </select>
            </div>
            <div class="col-md-4 col-lg-3">
                <div class="text-muted small">Số đăng ký</div>
                <div class="fs-5 fw-bold" th:text="${totalRegistrations}">0</div>
            </div>
        </form>
    </div>

    <div class="card card-custom overflow-hidden">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-primary">
                <tr>
                    <th scope="col" class="text-center">STT</th>
                    <th scope="col">Mã nhóm</th>
                    <th scope="col">Tên đề tài</th>
                    <th scope="col">Đợt đăng ký</th>
                    <th scope="col">Ngày đăng ký</th>
                    <th scope="col" class="text-center">Trạng thái</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="registration, row : ${registrations}">
                    <td class="text-center" th:text="${row.count}">1</td>
                    <td class="fw-semibold" th:text="${registration.group.groupCode}">N01</td>
                    <td th:text="${registration.topic.title}">Tên đề tài</td>
                    <td th:text="${registration.group.period.name}">Đợt đăng ký</td>
                    <td th:text="${#temporals.format(registration.registeredAt, 'dd/MM/yyyy HH:mm')}">01/01/2026 08:00</td>
                    <td class="text-center">
                        <span th:if="${registration.status.name() == 'PENDING'}" class="badge text-bg-warning"
                              th:text="${registration.status.displayName}">Chờ duyệt</span>
                        <span th:if="${registration.status.name() == 'APPROVED'}" class="badge text-bg-success"
                              th:text="${registration.status.displayName}">Đã phê duyệt</span>
                        <span th:if="${registration.status.name() == 'REJECTED'}" class="badge text-bg-danger"
                              th:text="${registration.status.displayName}">Từ chối</span>
                        <span th:if="${registration.status.name() == 'CANCELLED'}" class="badge text-bg-secondary"
                              th:text="${registration.status.displayName}">Hủy đăng ký</span>
                    </td>
                </tr>
                <tr th:if="${registrations.empty}">
                    <td colspan="6" class="text-center text-muted py-5">
                        Chưa có kết quả đăng ký đề tài cho đợt này.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
