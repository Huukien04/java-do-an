<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Tra cứu Điểm & Kết quả Đánh giá</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold mb-1">
                <i class="bi bi-award-fill text-warning me-2"></i>TRA CỨU ĐIỂM & KẾT QUẢ ĐÁNH GIÁ
            </h3>
            <p class="text-muted mb-0">Danh sách kết quả bảo vệ đề tài (Môn học / NCKH / KLTN) đã được công bố</p>
        </div>
    </div>

    <!-- Search & Filter Card -->
    <div class="card card-custom p-4 mb-4">
        <div class="row g-3">
            <div class="col-md-8">
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-search text-muted"></i></span>
                    <input type="text" id="searchInput" onkeyup="filterResults()" class="form-control bg-light border-start-0" placeholder="Tìm kiếm theo Tên đề tài, Mã đề tài...">
                </div>
            </div>
            <div class="col-md-4">
                <select id="periodFilter" onchange="filterResults()" class="form-select bg-light">
                    <option value="">-- Tất cả Đợt đăng ký --</option>
                    <option th:each="p : ${periods}" th:value="${p.name}" th:text="${p.name}">Đợt 1</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Results Table Card -->
    <div class="card card-custom p-4">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0" id="resultsTable">
                <thead class="table-light">
                <tr>
                    <th style="width: 5%;">#</th>
                    <th style="width: 35%;">Tên Đề tài</th>
                    <th style="width: 15%;">Đợt Đăng ký</th>
                    <th style="width: 12%;" class="text-center">Điểm Tổng Kết</th>
                    <th style="width: 13%;" class="text-center">Trạng Thái</th>
                    <th style="width: 20%;">Nhận xét Hội đồng</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${results == null || results.empty}">
                    <td colspan="6" class="text-center text-muted py-5">
                        <i class="bi bi-inbox fs-1 d-block mb-2 text-secondary"></i>
                        Hiện chưa có kết quả điểm nào được công bố.
                    </td>
                </tr>
                <tr th:each="r, iter : ${results}">
                    <td class="fw-bold text-muted" th:text="${iter.count}">1</td>
                    <td>
                        <strong class="d-block text-dark mb-1" th:text="${r.topic.title}">Tên đề tài</strong>
                        <small class="text-muted">
                            <i class="bi bi-person-badge me-1"></i>GVHD: 
                            <span th:text="${r.topic.primaryAdvisor != null ? r.topic.primaryAdvisor.user.fullName : 'N/A'}">GV</span>
                        </small>
                    </td>
                    <td>
                        <span class="badge bg-secondary-subtle text-secondary px-2 py-1" th:text="${r.topic.period.name}">Đợt 1</span>
                        <small class="d-block text-muted mt-1" th:text="${r.topic.period.periodType.displayName}">KLTN</small>
                    </td>
                    <td class="text-center">
                        <span class="fs-5 fw-bold"
                              th:classappend="${r.finalScore >= 8.0 ? 'text-primary' : (r.finalScore >= 5.0 ? 'text-success' : 'text-danger')}"
                              th:text="${#numbers.formatDecimal(r.finalScore, 1, 2)}">8.50</span>
                    </td>
                    <td class="text-center">
                        <span class="badge px-3 py-2 rounded-pill"
                              th:classappend="${r.evaluationStatus.name() == 'PASSED' ? 'bg-success' : 'bg-danger'}"
                              th:text="${r.evaluationStatus.displayName}">ĐẠT</span>
                    </td>
                    <td>
                        <span class="small text-muted" th:text="${r.chairmanComments != null && !r.chairmanComments.empty ? r.chairmanComments : 'Chưa có nhận xét'}">Nhận xét...</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<th:block layout:fragment="scripts">
    <script>
        function filterResults() {
            let searchInput = document.getElementById("searchInput").value.toLowerCase();
            let periodFilter = document.getElementById("periodFilter").value.toLowerCase();
            let table = document.getElementById("resultsTable");
            let rows = table.getElementsByTagName("tr");

            for (let i = 1; i < rows.length; i++) {
                let row = rows[i];
                if (row.getElementsByTagName("td").length < 6) continue;

                let titleText = row.getElementsByTagName("td")[1].textContent.toLowerCase();
                let periodText = row.getElementsByTagName("td")[2].textContent.toLowerCase();

                let matchesSearch = titleText.includes(searchInput);
                let matchesPeriod = periodFilter === "" || periodText.includes(periodFilter);

                if (matchesSearch && matchesPeriod) {
                    row.style.display = "";
                } else {
                    row.style.display = "none";
                }
            }
        }
    </script>
</th:block>
</body>
</html>
