server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: topic-management
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/hcmute_topic_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 105MB

# Application specific upload path
app:
  upload:
    dir: ${user.home}/uploads/hcmute-topics/
  # Gui email thong bao khi cong bo ket qua (Gmail SMTP).
  # Chua cau hinh MAIL_USERNAME/MAIL_PASSWORD thi he thong bo qua buoc gui mail,
  # cac chuc nang khac van chay binh thuong.
  mail:
    enabled: ${MAIL_ENABLED:false}
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:}

logging:
  level:
    root: INFO
    com.hcmute.topicmanagement: DEBUG
    org.hibernate.SQL: WARN