<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/main}">
<head>
    <title>Thông báo Khoa CNTT</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <div th:replace="~{fragments/components :: pageHeading('THÔNG BÁO CHÍNH THỨC KHOA CNTT', 'Cập nhật tin tức, lịch phản biện và thông báo kết quả mới nhất', 'bi-megaphone')}"></div>
        </div>
        <a sec:authorize="hasRole('ADMIN')" href="/notifications/create" class="btn btn-primary shadow-sm rounded-pill px-3">
            <i class="bi bi-plus-circle me-1"></i> Đăng Thông báo Mới
        </a>
    </div>

    <div class="row g-4">
        <th:block th:if="${notifications.empty}">
            <div class="col-12" th:replace="~{fragments/components :: emptyState('bi-bell', 'Chưa có thông báo nào.', 'Thông báo mới sẽ xuất hiện tại đây.')}"></div>
        </th:block>
        <div class="col-12" th:each="n : ${notifications}">
            <div class="card card-custom p-4">
                <div class="d-flex justify-content-between align-items-start mb-2">
                    <div>
                        <span class="badge bg-primary me-2" th:text="${n.type.displayName}">GENERAL</span>
                        <span class="badge bg-secondary" th:if="${n.targetRole}" th:text="${'Dành cho: ' + n.targetRole}">ALL</span>
                    </div>
                    <small class="text-muted" th:text="${#temporals.format(n.createdAt, 'dd/MM/yyyy HH:mm')}">Date</small>
                </div>
                <h4 class="fw-bold text-dark mb-2" th:text="${n.title}">Tiêu đề thông báo</h4>
                <p class="text-secondary lh-lg mb-0" th:text="${n.content}">Nội dung chi tiết thông báo...</p>
                <div class="mt-3 pt-2 border-top text-end">
                    <small class="text-muted">Đăng bởi: <strong th:text="${n.createdByFullName}">Trưởng Khoa</strong></small>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
