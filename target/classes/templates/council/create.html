<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Thành lập Hội đồng Mới</title>
</head>
<body>
<div layout:fragment="content">
    <div class="mb-4">
        <h3 class="fw-bold mb-1">THÀNH LẬP HỘI ĐỒNG PHẢN BIỆN</h3>
        <p class="text-muted mb-0">Yêu cầu từ 3 đến 5 Giảng viên (Đúng 1 Chủ tịch, 1 Thư ký và các Ủy viên)</p>
    </div>

    <div class="card card-custom p-4">
        <form th:action="@{/admin/councils/create}" th:object="${councilDTO}" method="post">
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="periodId" class="form-label fw-medium">Đợt Đăng Ký <span class="text-danger">*</span></label>
                    <select class="form-select" id="periodId" th:field="*{periodId}" required>
                        <option value="">-- Chọn đợt --</option>
                        <option th:each="p : ${periods}" th:value="${p.id}" th:text="${p.name}"></option>
                    </select>
                </div>

                <div class="col-md-3">
                    <label for="councilCode" class="form-label fw-medium">Mã Hội đồng <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="councilCode" th:field="*{councilCode}" placeholder="Vd: HD_KTPM_01" required>
                </div>

                <div class="col-md-3">
                    <label for="name" class="form-label fw-medium">Tên Hội đồng <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="name" th:field="*{name}" placeholder="Vd: Hội đồng KTPM 1" required>
                </div>

                <div class="col-md-6">
                    <label for="defenseDate" class="form-label fw-medium">Thời gian Báo cáo Báo vệ</label>
                    <input type="datetime-local" class="form-control" id="defenseDate" th:field="*{defenseDate}">
                </div>

                <div class="col-md-6">
                    <label for="location" class="form-label fw-medium">Địa điểm / Phòng Báo cáo</label>
                    <input type="text" class="form-control" id="location" th:field="*{location}" placeholder="Vd: Phòng Hội trường H5.1, Tầng 5">
                </div>

                <hr class="my-4">
                <h5 class="fw-bold text-primary mb-2"><i class="bi bi-people-fill me-2"></i>Phân công Giảng viên Hội đồng</h5>

                <div class="col-md-6">
                    <label for="chairmanTeacherId" class="form-label fw-medium">Chủ tịch Hội đồng <span class="text-danger">*</span></label>
                    <select class="form-select" id="chairmanTeacherId" th:field="*{chairmanTeacherId}" required>
                        <option value="">-- Chọn Chủ tịch --</option>
                        <option th:each="t : ${teachers}" th:value="${t.id}" th:text="${t.user.fullName + ' (' + t.teacherCode + ')'}"></option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label for="secretaryTeacherId" class="form-label fw-medium">Thư ký Hội đồng <span class="text-danger">*</span></label>
                    <select class="form-select" id="secretaryTeacherId" th:field="*{secretaryTeacherId}" required>
                        <option value="">-- Chọn Thư ký --</option>
                        <option th:each="t : ${teachers}" th:value="${t.id}" th:text="${t.user.fullName + ' (' + t.teacherCode + ')'}"></option>
                    </select>
                </div>

                <div class="col-12">
                    <label for="memberTeacherIds" class="form-label fw-medium">Các Ủy viên Hội đồng (Chọn từ 1 đến 3 Giảng viên khác)</label>
                    <select class="form-select" id="memberTeacherIds" th:field="*{memberTeacherIds}" multiple style="height: 120px;">
                        <option th:each="t : ${teachers}" th:value="${t.id}" th:text="${t.user.fullName + ' (' + t.teacherCode + ' - ' + t.department.name + ')'}"></option>
                    </select>
                    <small class="text-muted">Giữ phím Ctrl (hoặc Cmd trên Mac) để chọn nhiều Giảng viên.</small>
                </div>

                <hr class="my-4">
                <h5 class="fw-bold text-primary mb-2"><i class="bi bi-journal-plus me-2"></i>Gán Đề tài cho Hội đồng</h5>

                <div class="col-12">
                    <select class="form-select" id="assignedTopicIds" th:field="*{assignedTopicIds}" multiple style="height: 120px;">
                        <option th:each="top : ${assignedTopics}" th:value="${top.id}" th:text="${top.title + ' (GVHD: ' + top.createdByTeacher.user.fullName + ')'}"></option>
                    </select>
                </div>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                <a href="/admin/councils" class="btn btn-outline-secondary px-4">Hủy bỏ</a>
                <button type="submit" class="btn btn-primary px-4"><i class="bi bi-save me-1"></i> Tạo Hội đồng</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
