<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Chi tiết Đề tài</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-start mb-4">
        <div>
            <a href="/topics" class="btn btn-sm btn-outline-secondary mb-2"><i class="bi bi-arrow-left"></i> Quay lại Danh sách</a>
            <h3 class="fw-bold mb-1" th:text="${topic.title}">Tên đề tài</h3>
            <div class="d-flex gap-2 align-items-center">
                <span class="badge bg-primary" th:text="${topic.departmentName}">KTPM</span>
                <span class="badge bg-info text-dark" th:text="${topic.periodName}">Đợt 1</span>
                <span class="badge bg-success" th:text="${topic.status.displayName}">APPROVED</span>
            </div>
        </div>
        <div sec:authorize="hasRole('TEACHER')" th:if="${currentTeacherId != null and currentTeacherId == topic.createdByTeacherId and topic.status.name() != 'APPROVED' and topic.status.name() != 'ASSIGNED'}">
            <a th:href="@{/topics/{id}/edit(id=${topic.id})}" class="btn btn-outline-secondary rounded-pill px-3">
                <i class="bi bi-pencil me-1"></i> Chỉnh sửa Đề tài
            </a>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-md-8">
            <div class="card card-custom p-4 mb-4">
                <h5 class="fw-bold mb-3"><i class="bi bi-file-text text-primary me-2"></i>Mô tả Đề tài</h5>
                <p class="lh-lg" th:text="${topic.description}">Mô tả chi tiết</p>

                <h5 class="fw-bold mb-3 mt-4"><i class="bi bi-gear text-primary me-2"></i>Yêu cầu Kỹ thuật / Kiến thức</h5>
                <p class="lh-lg text-secondary" th:text="${topic.requirements}">Yêu cầu kỹ thuật</p>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card card-custom p-4">
                <h5 class="fw-bold mb-3"><i class="bi bi-people text-primary me-2"></i>Giảng viên Hướng dẫn</h5>
                <div class="mb-3 p-3 bg-light rounded-3">
                    <small class="text-muted d-block mb-1">GVHD Chuyên trách (GVHD 1)</small>
                    <strong class="fs-6 text-primary" th:text="${topic.primaryAdvisorName}">GV 1</strong>
                </div>
                <div th:if="${topic.secondaryAdvisorName}" class="p-3 bg-light rounded-3">
                    <small class="text-muted d-block mb-1">GVHD Đồng hướng dẫn (GVHD 2)</small>
                    <strong class="fs-6 text-secondary" th:text="${topic.secondaryAdvisorName}">GV 2</strong>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
