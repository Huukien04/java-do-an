server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: topic-management

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/hcmute_topic_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8}
    username: root
    password: 
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# Application specific upload path
app:
  upload:
    dir: ${user.home}/uploads/hcmute-topics/

logging:
  level:
    root: INFO
    com.hcmute.topicmanagement: DEBUG
    org.hibernate.SQL: WARN
